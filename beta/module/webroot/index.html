<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXELIFY NEXT MONITOR</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url(background.png);
            max-width: 100%;
            height: auto;
            color: white;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Google Sans', Roboto, sans-serif;
        }

        .root_container {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
            background-color: antiquewhite;
            padding: 40px;
            margin: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 500px;
        }

        .title {
            text-align: center;
            background-position: center;
            background-size: cover;
            background-image: url(banner.png);
            height: 100px;
            width: 90%;
            margin-bottom: 20px;
            border-radius: 20px;
        }

        .log-console {
            background-color: black;
            color: #00ff00;
            border-radius: 12px;
            padding: 20px;
            font-size: 10px;
            width: 100%;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .text-console {
            color: black;
            font-weight: bold;
            margin-bottom: 10px;
            align-self: flex-start;
        }

        .status-card {
            margin-top: 10px;
            background-color: white;
            color: black;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            font-weight: 500;
        }

        .status-detail {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
            background-color: #ccc;
            flex-shrink: 0;
        }

        .refresh-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }

        .status-dot.checking {
            animation: blink 0.8s infinite;
            background-color: #FFC107;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        footer {
            margin-top: 50px;
            font-size: 14px;
            color: black;
            background-color: white;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="title"></div>
    <div class="root_container">
        <div class="text-console">Log Console</div>
        <div class="log-console" id="log-console">INITIALIZING...</div>

        <div id="status-panel" style="width: 100%;">
            <div class="status-card">
                <div>
                    <span>Zygisk Module</span>
                    <div class="status-detail" id="detail-zygisk"></div>
                </div>
                <div id="dot-zygisk" class="status-dot"></div>
            </div>

            <div class="status-card">
                <div>
                    <span>Spoofing Engine</span>
                    <div class="status-detail" id="detail-spoof"></div>
                </div>
                <div id="dot-spoof" class="status-dot"></div>
            </div>

            <div class="status-card">
                <div>
                    <span>Unlimited Storage</span>
                    <div class="status-detail" id="detail-storage"></div>
                </div>
                <div id="dot-storage" class="status-dot"></div>
            </div>

            <div class="status-card">
                <div>
                    <span id="photos-version-text">Photos Version</span>
                    <div class="status-detail" id="detail-photos"></div>
                </div>
                <div id="dot-photos" class="status-dot"></div>
            </div>

            <div class="status-card">
                <div>
                    <span>Zygisk Spoof Status</span>
                    <div class="status-detail" id="detail-zygisk-status"></div>
                </div>
                <div id="dot-zygisk-status" class="status-dot"></div>
            </div>

            <button class="refresh-btn" onclick="forceRefresh()">Force Stop & Verify</button>
        </div>
    </div>

    <script>
        const MODULE_ID = "PixelifyNext";
        const TARGET_PKG = "com.google.android.apps.photos";

        async function execShell(command) {
            try {
                if (typeof ksu !== 'undefined' && ksu.exec) {
                    let result = await ksu.exec(command);
                    return result ? result.trim() : "";
                } else if (typeof mmrl !== 'undefined' && mmrl.exec) {
                    let result = await mmrl.exec(command);
                    return result ? result.trim() : "";
                }
                return "ERROR_NO_API";
            } catch (e) {
                return "ERROR_EXEC";
            }
        }

        async function forceRefresh() {
            const consoleDiv = document.getElementById('log-console');
            consoleDiv.innerText = "Killing Google Photos...\nWaiting for restart...";
            await execShell(`am force-stop ${TARGET_PKG}`);
            setTimeout(() => { refreshDashboard(); }, 1500);
        }

        async function refreshDashboard() {
            const consoleDiv = document.getElementById('log-console');
            const storageDot = document.getElementById('dot-storage');
            let logs = [];

            let testRoot = await execShell("id -u");
            if (testRoot === "ERROR_NO_API") {
                consoleDiv.innerText = "Critical Error: API Not Found.";
                return;
            }
            logs.push("[OK] Root API Connected");

            let modCheck = await execShell(`[ -d "/data/adb/modules/${MODULE_ID}" ] && echo "YES" || echo "NO"`);
            updateStatus('dot-zygisk', modCheck === "YES");
            if (modCheck === "YES") {
                document.getElementById('detail-zygisk').innerText = "Module installed";
            } else {
                document.getElementById('detail-zygisk').innerText = "Module not found";
            }

            let statusFile = await execShell(`cat /data/adb/modules/${MODULE_ID}/zygisk_status 2>/dev/null`);
            if (statusFile && statusFile.length > 0 && statusFile !== "ERROR_EXEC") {
                let parts = statusFile.split("|");
                let spoofPkg = parts[0] || "unknown";
                let spoofModel = parts[1] || "unknown";
                updateStatus('dot-zygisk-status', true);
                document.getElementById('detail-zygisk-status').innerText = spoofPkg + " -> " + spoofModel;
                logs.push("[OK] Last spoof: " + spoofPkg + " as " + spoofModel);
            } else {
                updateStatus('dot-zygisk-status', 'warn');
                document.getElementById('detail-zygisk-status').innerText = "No spoof data yet";
                logs.push("[!] No Zygisk status file found");
            }

            let pid = await execShell(`pidof ${TARGET_PKG}`);
            if (!pid) {
                updateStatus('dot-spoof', 'warn');
                document.getElementById('detail-spoof').innerText = "Photos not running";
                logs.push("[!] Photos closed. Open it to verify.");
            } else {
                let logCheck = await execShell(`logcat -d -s PixelifyPhotos:I --pid=${pid} 2>/dev/null | tail -1`);
                if (logCheck && logCheck.includes("spoof applied")) {
                    updateStatus('dot-spoof', true);
                    document.getElementById('detail-spoof').innerText = "Active in PID " + pid;
                    logs.push("[OK] Photos spoofed in PID: " + pid);
                } else {
                    let statusMatch = statusFile && statusFile.includes("com.google.android.apps.photos");
                    if (statusMatch) {
                        updateStatus('dot-spoof', true);
                        document.getElementById('detail-spoof').innerText = "Confirmed via status file";
                        logs.push("[OK] Spoof confirmed via status file");
                    } else {
                        updateStatus('dot-spoof', false);
                        document.getElementById('detail-spoof').innerText = "Not detected";
                        logs.push("[ERR] No injection detected");
                    }
                }
            }

            storageDot.classList.add('checking');
            let storageCheck = await execShell("pm list features | grep com.google.android.feature.PIXEL_2016_EXPERIENCE");
            let storageOk = storageCheck.includes("2016_EXPERIENCE");
            updateStatus('dot-storage', storageOk);
            document.getElementById('detail-storage').innerText = storageOk ? "Pixel 2016 feature present" : "Feature not found";
            storageDot.classList.remove('checking');

            let resPhotos = await execShell(`dumpsys package ${TARGET_PKG} | grep versionName | head -n 1 | cut -d'=' -f2`);
            if (resPhotos) {
                document.getElementById('photos-version-text').innerText = "Photos: " + resPhotos;
                updateStatus('dot-photos', true);
                document.getElementById('detail-photos').innerText = "Installed";
            } else {
                updateStatus('dot-photos', false);
                document.getElementById('detail-photos').innerText = "Not installed";
            }

            consoleDiv.innerText = logs.join("\n");
        }

        function updateStatus(dotId, state) {
            const dotElem = document.getElementById(dotId);
            if (!dotElem) return;
            if (state === true) dotElem.style.backgroundColor = "#4CAF50";
            else if (state === 'warn') dotElem.style.backgroundColor = "#FFC107";
            else dotElem.style.backgroundColor = "#F44336";
        }

        refreshDashboard();
    </script>

    <footer>By the PixelifyNEXT project</footer>
</body>

</html>
